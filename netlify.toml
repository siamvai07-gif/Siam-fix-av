[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/bkash"
  to = "/bkash.html"
  status = 200

[[redirects]]
  from = "/nagad"
  to = "/nagad.html"
  status = 200

[[redirects]]
  from = "/extension.js"
  to = "/extension.js"
  status = 200

[[redirects]]
  from = "/SX_PRO.user.js"
  to = "/extension.js"
  status = 200

[[redirects]]
  from = "/api/admin/action"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
